<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circuit Lab · board preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f4ecdc; font-family: "Barlow Semi Condensed", sans-serif; }
      #stage { position: fixed; inset: 0; overflow: hidden; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #bar { position: fixed; left: 12px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; }
      #bar a, #bar button { font: 600 14px "Barlow Semi Condensed", sans-serif; padding: 4px 10px; border-radius: 6px; border: 1px solid #1d2440; background: #fffaf0; color: #1d2440; text-decoration: none; cursor: pointer; }
      #bar a[aria-current="page"] { background: #1d2440; color: #fffaf0; }
      #info { position: fixed; left: 12px; bottom: 10px; font: 500 13px "IBM Plex Mono", monospace; color: #1d2440; max-width: 70ch; z-index: 2; }
      body.clean #bar, body.clean #info { display: none; }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <div id="stage"><canvas id="board-canvas"></canvas></div>
    <div id="info"></div>
    <script type="module" src="./boards.js"></script>
  </body>
</html>
