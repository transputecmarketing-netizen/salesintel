<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:P;font-weight:300;src:url(../assets/fonts/poppins-300.woff2)}@font-face{font-family:P;font-weight:500;src:url(../assets/fonts/poppins-500.woff2)}@font-face{font-family:P;font-weight:600;src:url(../assets/fonts/poppins-600.woff2)}@font-face{font-family:M;font-weight:400;src:url(../assets/fonts/jbm-400.woff2)}@font-face{font-family:M;font-weight:500;src:url(../assets/fonts/jbm-500.woff2)}
*{margin:0;padding:0;box-sizing:border-box}body{width:560px;height:150px;overflow:hidden;font-family:P,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;position:relative}
#logo{position:absolute;left:26px;top:24px;height:10px}.web{position:absolute;left:26px;bottom:20px;font-family:M;font-weight:500;font-size:8.6px;letter-spacing:.14em;color:#fff}.web span{color:#3B8BFF}
#top{position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,rgba(59,139,255,0),rgba(59,139,255,.9) 30%,rgba(59,139,255,.15) 80%,rgba(59,139,255,0))}
body{background:#070B14}
#bg{position:absolute;inset:0;background:radial-gradient(45% 120% at 78% 40%,rgba(44,114,219,.22),rgba(44,114,219,0) 70%),linear-gradient(100deg,#060912,#0A0F1A 50%,#0B1424)}
#h{position:absolute;left:26px;top:44px;font-weight:600;font-size:23px;letter-spacing:-.035em;line-height:1.06}#h span{background:linear-gradient(90deg,#5AA2FF,#3B8BFF);-webkit-background-clip:text;color:transparent}
.sl{position:absolute;left:26px;top:100px;font-weight:300;font-size:10px;color:#AEBACC}
#w{position:absolute;left:278px;top:18px;width:262px;height:114px;border-radius:9px;background:#05080F;border:1px solid rgba(59,139,255,.3);overflow:hidden}
#bar{height:16px;display:flex;align-items:center;gap:4px;padding:0 8px;background:rgba(174,186,204,.06);border-bottom:1px solid rgba(174,186,204,.1)}#bar i{width:5px;height:5px;border-radius:50%;background:rgba(174,186,204,.3)}#bar span{margin-left:auto;font-family:M;font-size:6px;letter-spacing:.12em;color:rgba(174,186,204,.6)}
#tx{padding:7px 10px;font-family:M;font-size:8.4px;line-height:15px;color:#DCE6F5;white-space:pre}
.p{color:#3B8BFF}.ok{color:#3B8BFF}.dim{color:rgba(174,186,204,.55)}
#cur{display:inline-block;width:5px;height:9px;background:#3B8BFF;vertical-align:-1px}
</style><div id="bg"></div><div id="top"></div><img id="logo" src="../assets/logo-white.svg">
<div id="h">Your IT,<br><span>handled.</span></div><div class="sl">Managed IT, cloud, cyber and AI.</div>
<div id="w"><div id="bar"><i></i><i></i><i></i><span>TRANSPUTEC ~</span></div><div id="tx"></div></div>
<div class="web">TRANSPUTEC<span>.</span>COM</div>
<script>const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3), inout = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2, clamp = x => Math.max(0, Math.min(1, x));
window.DUR = 8.0;
const CMD = "transputec status";
const L = [["managed-it", "handled"], ["cloud", "handled"], ["cybersecurity", "handled"], ["ai", "handled"]];
const dots = n => ".".repeat(Math.max(2, 16 - n.length));
function full(k, typed, cursor) {
  let s = '<span class="p">$</span> ' + CMD.slice(0, typed);
  if (typed >= CMD.length) { for (let i = 0; i < k; i++) s += '\n' + L[i][0] + ' <span class="dim">' + dots(L[i][0]) + '</span> <span class="ok">✓ ' + L[i][1] + '</span>'; }
  return s + (cursor ? '<span id="cur"></span>' : '');
}
window.render = t => {
  const blink = Math.floor(t * 2.5) % 2 === 0;
  let html;
  if (t < 1.4) html = full(4, CMD.length, blink);               // complete first frame
  else if (t < 1.7) html = '<span class="p">$</span> ' + (blink ? '<span id="cur"></span>' : '');
  else if (t < 3.0) html = full(0, Math.floor((t - 1.7) / 1.3 * CMD.length), true);
  else html = full(Math.min(4, Math.floor((t - 3.0) / .75) + 1), CMD.length, blink);
  document.getElementById('tx').innerHTML = html;
};
render(0);</script>
