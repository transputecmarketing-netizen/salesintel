    document.querySelector('#g' + i + ' u').style.width = (i < k ? 100 : i === k ? Math.min(100, u / SEG * 100) : 0) + '%'; }
  // sheen across the wordmark at the start of each segment
  document.getElementById('sheen').style.left = (-50 + 220 * ease((u - .1) / .9)) + 'px';
};
render(0);
</script>
