function gradTex(stops, w = 1024, h = 1024, radial = false) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');

}

if (SCENE === '4') {           // ---------- data skyline
  scene.background = new THREE.Color(0x050814); scene.fog = new THREE.FogExp2(0x070c1d, .06);
  cam.position.set(0, 1.5, 11); cam.lookAt(0, 2.0, 0); cam.fov = 38; cam.updateProjectionMatrix();
  const cols = 60, rows = 26, cs = .62, N = cols * rows;
  const bm = new THREE.MeshStandardMaterial({ color: 0x0c1530, roughness: .35, metalness: .7, envMapIntensity: .8 });

  const caps = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: true }), N);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), pos = new THREE.Vector3(); let k = 0; const col = new THREE.Color();
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x = (c - cols / 2) * cs, z = -r * cs * 1.0 + 1.5;
    const side = Math.max(0, (Math.abs(x) - 2.2) / 5.5); const h = .1 + rnd() * (.5 + side * 5.2) * (0.35 + .65 * Math.min(1, side * 2.2)) + side * 1.2 * rnd();
    sc.set(cs * .84, h, cs * .84); pos.set(x, h / 2 - .4, z); m.compose(pos, q, sc); boxes.setMatrixAt(k, m);

function makeBot(scale = 1, shellCol = 0x9FB2D3) {

  const e2 = new THREE.Mesh(new THREE.CapsuleGeometry(.11, .34, 8, 16), eyeM2); e2.position.set(.42, 1.18, .94); g.add(e2);
  const smile = new THREE.Mesh(new THREE.TorusGeometry(.26, .035, 8, 40, Math.PI * .7), glow(CY.clone().lerp(RY, .5), 2.6)); smile.position.set(0, .86, .93); smile.rotation.z = Math.PI + Math.PI * .15; g.add(smile);
  for (const sx of [-1, 1]) {

    const er = new THREE.Mesh(new THREE.TorusGeometry(.24, .04, 8, 40), glow(sx < 0 ? CY : RY, 2.6)); er.rotation.y = Math.PI / 2; er.position.set(sx * 1.32, 1.15, 0); g.add(er);
  }
  const ant = new THREE.Mesh(new THREE.CylinderGeometry(.035, .035, .55, 12), accent); ant.position.set(0, 2.3, 0); g.add(ant);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(.13, 24, 24), glow(CY, 3)); tip.position.set(0, 2.62, 0); g.add(tip);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(.32, .38, .25, 32), accent); neck.position.y = .12; g.add(neck);
  const body = new THREE.Mesh(new RoundedBoxGeometry(1.7, 1.4, 1.2, 10, .5), shell); body.position.y = -.75; g.add(body);
  const chest = new THREE.Mesh(new RoundedBoxGeometry(.8, .62, .12, 6, .1), visorM); chest.position.set(0, -.62, .58); g.add(chest);
  const tb = new THREE.Mesh(new THREE.BoxGeometry(.42, .08, .05), glow(CY, 2.8)); tb.position.set(-.03, -.5, .66); g.add(tb);
  const ts = new THREE.Mesh(new THREE.BoxGeometry(.08, .34, .05), glow(RY, 2.8)); ts.position.set(-.06, -.71, .66); g.add(ts);
  for (const sx of [-1, 1]) {
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(.2, .55, 8, 20), shell); arm.position.set(sx * 1.12, -.75, .1); arm.rotation.z = sx * .35; g.add(arm);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(.24, 32, 32), accent); hand.position.set(sx * 1.32, -1.2, .2); g.add(hand);
  }

  const thr2 = new THREE.Mesh(new THREE.TorusGeometry(.9, .025, 12, 60), glow(RY, 2.4)); thr2.rotation.x = Math.PI / 2; thr2.position.y = -1.9; g.add(thr2);
  g.scale.setScalar(scale); return g;

function orbBot(r = 1, eyeC = CY) {

  g.add(new THREE.Mesh(new THREE.SphereGeometry(r, 64, 64), shell));
  const band = new THREE.Mesh(new RoundedBoxGeometry(r * 1.3, r * .56, r * .5, 8, r * .22), dark); band.position.z = r * .72; g.add(band);
  for (const sx of [-1, 1]) { const e = new THREE.Mesh(new THREE.SphereGeometry(r * .13, 24, 24), glow(eyeC, 3.2)); e.position.set(sx * r * .28, r * .02, r * .98); e.scale.set(1, 1.3, .4); g.add(e); }

  return g;
}

function ui(logo, pos, txt) {

}
const comp = new EffectComposer(renderer); comp.setSize(W, H);

comp.render(); comp.render();
