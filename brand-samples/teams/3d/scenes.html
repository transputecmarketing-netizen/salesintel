<script type="module">

    const s = new THREE.Mesh(new THREE.SphereGeometry(r, 64, 64), glass({ attenuationColor: new THREE.Color(c) })); s.position.set(x, y, z); scene.add(s);

  const p1 = new THREE.PointLight(0x00B8DB, 90, 0, 2); p1.position.set(-5, 2, 3); scene.add(p1);

  const lightWall = new THREE.Mesh(new THREE.PlaneGeometry(26, 9), new THREE.MeshBasicMaterial({ map: tex })); lightWall.position.set(0, 3.1, -4.3); scene.add(lightWall);
  const sm = new THREE.MeshPhysicalMaterial({ color: 0x0a1020, roughness: .25, metalness: .5, clearcoat: 1, envMapIntensity: .6 });
  for (let i = -66; i <= 66; i++) { const s = new THREE.Mesh(new RoundedBoxGeometry(.13, 9, .34, 2, .03), sm); s.position.set(i * .2, 3.1, -4); scene.add(s); }

  const bar2 = bar.clone(); bar2.position.y = -.35; bar2.material = glow(RY, 2.4); scene.add(bar2);

  scene.background = new THREE.Color(0x070b18);
  const back = new THREE.Mesh(new THREE.PlaneGeometry(70, 40), new THREE.MeshBasicMaterial({ map: gradTex([[0, '#1b3d8f'], [.5, '#0b1430'], [1, '#070b18']], 1024, 1024, true) }));

  const placed = [];

    const side = i % 2 ? 1 : -1; const r = R(.25, 1.35); const x = side * R(3.0, 7.6), y = R(-3.2, 3.2), z = R(-3, 2.5);

  }
  for (let i = 0; i < 160; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(R(.02, .05), 8, 8), glow(grad(Math.random()), 2.4)); s.position.set((Math.random() < .5 ? -1 : 1) * R(2.5, 8), R(-4, 4), R(-3, 3)); scene.add(s); }

  const p1 = new THREE.PointLight(0x00B8DB, 130, 0, 2); p1.position.set(-6, 3, 4); scene.add(p1);

if (SCENE === '4') {           // ---------- data skyline
  scene.background = new THREE.Color(0x050814); scene.fog = new THREE.FogExp2(0x070c1d, .06);
  cam.position.set(0, 1.5, 11); cam.lookAt(0, 2.0, 0); cam.fov = 38; cam.updateProjectionMatrix();
  const cols = 60, rows = 26, cs = .62, N = cols * rows;
  const bm = new THREE.MeshStandardMaterial({ color: 0x0c1530, roughness: .35, metalness: .7, envMapIntensity: .8 });
  const boxes = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), bm, N);
  const caps = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: true }), N);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), pos = new THREE.Vector3(); let k = 0; const col = new THREE.Color();
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x = (c - cols / 2) * cs, z = -r * cs * 1.0 + 1.5;
    const side = Math.max(0, (Math.abs(x) - 2.2) / 5.5); const h = .1 + rnd() * (.5 + side * 5.2) * (0.35 + .65 * Math.min(1, side * 2.2)) + side * 1.2 * rnd();
    sc.set(cs * .84, h, cs * .84); pos.set(x, h / 2 - .4, z); m.compose(pos, q, sc); boxes.setMatrixAt(k, m);
    sc.set(cs * .84, .035, cs * .84); pos.set(x, h - .4 + .02, z); m.compose(pos, q, sc); caps.setMatrixAt(k, m);
    const tt = Math.min(1, Math.max(0, (x + 7) / 14)); const lit = Math.min(1, side * 1.8); col.copy(grad(tt)).multiplyScalar((rnd() < .3 ? 2.6 : 1.1) * (0.06 + 0.94 * lit)); caps.setColorAt(k, col); k++;
  }
  scene.add(boxes, caps);
  floor(-.42, 80, .8, 0x05080f);
  scene.add(new THREE.DirectionalLight(0x9fb7ff, 1.4).translateX(-4).translateY(8).translateZ(6));

const comp = new EffectComposer(renderer); comp.setSize(W, H);

comp.render(); comp.render();
window.__done = true;
